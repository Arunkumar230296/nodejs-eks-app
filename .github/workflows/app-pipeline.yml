
name: Node.js Application CI-CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "helm/**"
      - ".github/workflows/app-pipeline.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build Docker image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/nodejs-eks-app:${{ github.sha }}" .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-eks-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/nodejs-eks-app:${{ github.sha }}"

  deploy-to-eks:
    needs: build-test-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-southeast-2 \
            --name nodejs-eks-cluster

      - name: Deploy application
        run: |
          helm upgrade --install nodejs-app ./helm/nodejs-app \
            --namespace nodejs-app \
            --create-namespace \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/nodejs-eks-app \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl get deployments -n nodejs-app
          kubectl get pods -n nodejs-app
          kubectl get services -n nodejs-app
          kubectl get ingress -n nodejs-app
