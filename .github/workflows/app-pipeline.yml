name: Node.js Application CI-CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/app-pipeline.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run code checks
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/nodejs-eks-app:${{ github.sha }}" \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-eks-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/nodejs-eks-app:${{ github.sha }}"

      - name: Update Kubernetes deployment image
        uses: mikefarah/yq@v4.44.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          cmd: yq -i '.spec.template.spec.containers[0].image = strenv(DOCKERHUB_USERNAME) + "/nodejs-eks-app:" + strenv(IMAGE_TAG)' helm/nodejs-app/templates/deployment.yaml

      - name: Commit GitOps image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/nodejs-app/templates/deployment.yaml
          git commit -m "chore: update deployment image ${GITHUB_SHA}"
          git push origin HEAD:main